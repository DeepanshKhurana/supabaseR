url: https://deepanshkhurana.github.io/supabaseR/

home:
  sidebar:
    structure: [links, license, community, citation, authors, dev]
    components:
      community:
        title: Community
        text: |
          [Contributing](CONTRIBUTING.html)

template:
  bootstrap: 5
  light-switch: false
  bslib:
    bg: "#171717"
    fg: "#EDEDED"
    primary: "#3ECF8E"
    font-size-base: "0.9375rem"
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
      <script>
        (function(){
          var t;
          try { t = localStorage.getItem('sb-theme') || 'dark'; } catch(e) { t = 'dark'; }
          var r = t === 'auto' ? (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light') : t;
          document.documentElement.setAttribute('data-sb-theme', r);
          document.documentElement.setAttribute('data-bs-theme', r);
        })();
      </script>

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/DeepanshKhurana/supabaseR
      aria-label: View source on GitHub

reference:
  - title: Connection
    desc: Connect and manage Supabase connections
  - subtitle: Unified API
    desc: Auto-dispatches to DBI or REST based on available credentials
    contents:
      - sb_connect
      - sb_disconnect
      - sb_status
  - subtitle: DBI Backend
    desc: Direct PostgreSQL connection via DBI
    contents:
      - sb_db_connect
      - sb_db_disconnect
      - sb_db_status
      - sb_db_creds
  - subtitle: REST API Backend
    desc: Supabase REST API via PostgREST
    contents:
      - sb_api_connect
      - sb_api_disconnect
      - sb_api_status

  - title: Read Operations
    desc: Query and read data from tables
  - subtitle: Unified API
    contents:
      - sb_read
      - sb_query
      - sb_tables
      - sb_schema
      - sb_table_exists
  - subtitle: DBI Backend
    contents:
      - sb_db_read
      - sb_db_query
      - sb_db_tables
      - sb_db_schema
      - sb_db_table_exists
  - subtitle: REST API Backend
    contents:
      - sb_api_read
      - sb_api_query
      - sb_api_tables
      - sb_api_schema
      - sb_api_table_exists

  - title: Write Operations
    desc: Insert, update, delete, and upsert data
  - subtitle: Unified API
    contents:
      - sb_insert
      - sb_update
      - sb_delete
      - sb_upsert
      - sb_truncate
  - subtitle: DBI Backend
    contents:
      - sb_db_insert
      - sb_db_update
      - sb_db_delete
      - sb_db_upsert
      - sb_db_truncate
  - subtitle: REST API Backend
    contents:
      - sb_api_insert
      - sb_api_update
      - sb_api_delete
      - sb_api_upsert
      - sb_api_truncate

authors:
  Deepansh Khurana:
    href: https://github.com/deepanshkhurana
